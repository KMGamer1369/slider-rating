<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS 9-Dotted Ratings Bar</title>
    <style>
        /* Dark iOS-style background */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* The Translucent Dark Oval Container */
        .rating-container {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 4px 32px 4px 4px; /* Frames the large thumb perfectly */
            border-radius: 50px;
            background: rgba(40, 40, 40, 0.4); /* iOS Translucent dark base */
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 32px 0 rgba(0, 0, 0, 0.6);
            transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            height: 64px; /* Fixed height matching the iPhone slider profile */
            box-sizing: border-box;
        }

        /* Wrapper for the interactive range slider components */
        .slider-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 260px; 
            height: 56px; 
        }

        /* Pure Flex Grid Container for exactly 9 dots */
        .dots-container {
            position: absolute;
            left: 28px; /* Centers the dot track directly beneath the path of the thumb */
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between; /* Evenly distributes all 9 items */
            pointer-events: none;
            z-index: 1;
        }

        /* Individual Big Dot Styling */
        .dot {
            width: 10px; /* Big dot diameter */
            height: 10px;
            border-radius: 50%;
        }

        /* 3 Red Dots */
        .dot.red { background-color: #ff3b30; }
        /* 3 Yellow Dots */
        .dot.yellow { background-color: #ffcc00; }
        /* 3 Green Dots */
        .dot.green { background-color: #34c759; }

        /* Completely Transparent Range Input Layout Overlap */
        .rating-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 56px;
            background: transparent;
            outline: none;
            cursor: pointer;
            position: relative;
            z-index: 2; /* Ensures the thumb handle layers on top */
            margin: 0;
        }

        /* Native Track Overrides */
        .rating-slider::-webkit-slider-runnable-track {
            background: transparent;
            border: none;
            height: 56px;
        }

        /* Large iPhone-Style Selector Thumb */
        .rating-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 56px; 
            height: 56px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 1px rgba(0, 0, 0, 0.15), 0 3px 8px rgba(0, 0, 0, 0.3);
            margin-top: 0px; 
            transition: transform 0.1s ease;
        }

        /* Firefox Support Mappings */
        .rating-slider::-moz-range-track {
            background: transparent;
            border: none;
            height: 56px;
        }

        .rating-slider::-moz-range-thumb {
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 1px rgba(0, 0, 0, 0.15), 0 3px 8px rgba(0, 0, 0, 0.3);
        }

        /* Clean White Display Label */
        .rating-label {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 500;
            min-width: 45px;
            text-align: center;
            letter-spacing: -0.2px;
        }
    </style>
</head>
<body>

    <div class="rating-container" id="ratingContainer">
        <div class="slider-wrapper">
            <!-- Fixed 9-Dot Layout Layer -->
            <div class="dots-container">
                <div class="dot red"></div>
                <div class="dot red"></div>
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot yellow"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
                <div class="dot green"></div>
                <div class="dot green"></div>
            </div>
            
            <!-- Continuous fluid progressive slider (0 to 100) -->
            <input type="range" min="0" max="100" value="0" class="rating-slider" id="ratingSlider">
        </div>
        <div class="rating-label" id="ratingLabel">0%</div>
    </div>

    <script>
        const slider = document.getElementById('ratingSlider');
        const container = document.getElementById('ratingContainer');
        const label = document.getElementById('ratingLabel');

        function updateRating() {
            const value = parseInt(slider.value);
            label.textContent = `${value}%`;

            // Progressive calculation from Red (#ff3b30) to Yellow (#ffcc00) to Green (#34c759)
            let r, g, b;
            if (value < 50) {
                const ratio = value / 50;
                r = 255;
                g = Math.round(59 + (204 - 59) * ratio);
                b = Math.round(48 + (0 - 48) * ratio);
            } else {
                const ratio = (value - 50) / 50;
                r = Math.round(255 + (52 - 255) * ratio);
                g = Math.round(204 + (199 - 204) * ratio);
                b = Math.round(0 + (89 - 0) * ratio);
            }

            // Apply dynamic translucent color shifts to background frame
            container.style.background = `rgba(${r}, ${g}, ${b}, 0.15)`;
            container.style.borderColor = `rgba(${r}, ${g}, ${b}, 0.35)`;
            container.style.boxShadow = `0 10px 32px 0 rgba(0,0,0,0.5), 0 0 20px rgba(${r}, ${g}, ${b}, 0.15)`;
        }

        slider.addEventListener('input', updateRating);
        updateRating();
    </script>
</body>
</html>
